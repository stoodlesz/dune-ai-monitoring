[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dune-ai-monitoring"
version = "0.1.0"
description = "Utilities and experiments for AI-assisted coastal dune ecosystem monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.scripts]
dune-manifest-add = "dune_ai_monitoring.datasets.cli:main"
dune-pc-download = "dune_ai_monitoring.datasets.planetary_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
